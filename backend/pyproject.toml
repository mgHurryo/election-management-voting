[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "election-voting-backend"
version = "0.1.0"
description = "FastAPI foundation for the election management and voting system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
    "PyMySQL[rsa]>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "PyJWT>=2.10,<3",
    "bcrypt>=4.2,<6",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["mysql: requires an explicitly configured disposable MySQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

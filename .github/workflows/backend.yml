name: Backend

on:
  pull_request:
  push:
    branches: [master, release]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: election_test
          MYSQL_USER: election_test_app
          MYSQL_PASSWORD: ci-only-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      TEST_MYSQL_URL: mysql+pymysql://election_test_app:ci-only-test-password@127.0.0.1:3306/election_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.5
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test including MySQL
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Build distribution
        run: uv build
